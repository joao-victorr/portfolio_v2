server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas as rotas vão para index.html
    location / {
        try_files $uri /index.html;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
    }

    # Limite de upload (opcional)
    client_max_body_size 10M;

    # --------------------------
    # IP real vindo do proxy
    # --------------------------
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;  # aceita IPs de qualquer proxy (ou coloque o IP do seu proxy)
    
    # Logging via stdout/stderr para Docker
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
