services:
  portfolio-front:
    container_name: portfolio-front
    build:
      context: ./front
      dockerfile: Dockerfile
    env_file:
      - .front.env
    ports:
      - "127.0.0.1:3080:80"
    restart: unless-stopped
    networks:
      - portfolio-network
      - proxy-network

networks:
  portfolio-network:
    driver: bridge
    name: portfolio-network
  proxy-network:
    external: true
